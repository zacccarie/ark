name: ARK CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install system deps Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
                                  libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
                                  libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
                                  libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Install ARK + ML deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[viz,dev]"
          pip install ruff

      - name: Lint (ruff)
        run: ruff check ark/

      - name: Pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ --tb=line -q

  build-app:
    runs-on: macos-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ARK + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build .app
        run: python build_app.py

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARK-macos
          path: dist/ARK.app
          retention-days: 14
