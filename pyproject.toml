[project]
name = "ark"
version = "0.1.0"
description = "Node-based ML architecture builder. Python native. Refonte de ai-arch-builder."
authors = [{ name = "Zaccarie Aglas", email = "zaccarie@zaccarie.fr" }]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "torch>=2.5",
    "torchvision>=0.20",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "Pillow>=10.4",
    "requests>=2.32",
    "tqdm>=4.66",
    "imageio>=2.34",
]

[project.optional-dependencies]
ml = ["transformers>=4.40", "diffusers>=0.30", "huggingface-hub>=0.24", "peft>=0.12"]
viz = ["umap-learn>=0.5", "scikit-learn>=1.5", "plotly>=5.20", "bertviz>=1.4"]
cloud = ["modal>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ark = "ark.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
